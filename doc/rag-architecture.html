<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>智助侠 RAG 架构图</title>
  <style>
    body{margin:0;background:#020617;color:#e5e7eb;font-family:Consolas,"Microsoft YaHei",monospace}
    .wrap{max-width:1060px;margin:0 auto;padding:28px}
    h1{font-size:22px;margin:0 0 6px}
    p{margin:0 0 18px;color:#94a3b8}
    svg{width:100%;height:auto;border:1px solid #1e293b;border-radius:12px;background:#020617}
    text{font-family:Consolas,"Microsoft YaHei",monospace}
  </style>
</head>
<body>
<div class="wrap">
  <h1>智助侠 RAG 幻兽帕鲁实验版</h1>
  <p>独立 Python RAG 服务先跑通，后续由 Node 聊天工作流调用。</p>
  <svg viewBox="0 0 1000 520" role="img" aria-label="智助侠 RAG 架构图">
    <defs>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
      </pattern>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
      </marker>
    </defs>
    <rect width="1000" height="520" fill="url(#grid)"/>
    <line x1="180" y1="160" x2="360" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="560" y1="160" x2="750" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="460" y1="220" x2="460" y2="330" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="50" y="110" width="130" height="100" rx="8" fill="rgba(8,51,68,.45)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="115" y="145" fill="#fff" font-size="15" text-anchor="middle">WPF 插件</text>
    <text x="115" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">游戏内提问</text>
    <rect x="360" y="110" width="200" height="100" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399" stroke-width="1.5"/>
    <text x="460" y="145" fill="#fff" font-size="15" text-anchor="middle">Node 聊天服务</text>
    <text x="460" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">后续接入 /api/chat</text>
    <rect x="750" y="110" width="190" height="100" rx="8" fill="rgba(6,78,59,.45)" stroke="#34d399" stroke-width="1.5"/>
    <text x="845" y="145" fill="#fff" font-size="15" text-anchor="middle">Python RAG</text>
    <text x="845" y="170" fill="#94a3b8" font-size="11" text-anchor="middle">:5188 /api/rag/query</text>
    <rect x="330" y="330" width="260" height="110" rx="8" fill="rgba(76,29,149,.45)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="460" y="365" fill="#fff" font-size="15" text-anchor="middle">JSONL 知识库</text>
    <text x="460" y="390" fill="#94a3b8" font-size="11" text-anchor="middle">data/games/palworld</text>
    <text x="460" y="414" fill="#94a3b8" font-size="11" text-anchor="middle">后续扩展不同 gameId</text>
  </svg>
</div>
</body>
</html>
